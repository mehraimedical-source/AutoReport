name: Build and test NET Framework 4.8
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build library and CLI
        run: msbuild src/AutoReport.Cli/AutoReport.Cli.csproj /restore /p:Configuration=Release
      - name: Build WinForms test UI
        run: msbuild src/AutoReport.WinForms/AutoReport.WinForms.csproj /restore /p:Configuration=Release
      - name: Smoke test bundled Paddle runtime
        timeout-minutes: 5
        shell: pwsh
        run: |
          $appDir = (Resolve-Path "src/AutoReport.WinForms/bin/Release/net48").Path
          $logPath = Join-Path $env:RUNNER_TEMP "autoreport-paddle-smoke.txt"
          $process = Start-Process -FilePath (Join-Path $appDir "AutoReport.WinForms.exe") -ArgumentList @("--self-test", $logPath) -WorkingDirectory $appDir -Wait -PassThru
          if (Test-Path $logPath) { Get-Content $logPath }
          if ($process.ExitCode -ne 0) { throw "Bundled Paddle smoke test failed: $($process.ExitCode)" }
          if (!(Test-Path $logPath)) { throw "Smoke test produced no result" }
      - name: Build regression tests
        run: msbuild tests/AutoReport.Tests/AutoReport.Tests.csproj /restore /p:Configuration=Release
      - name: Run regression tests
        run: tests/AutoReport.Tests/bin/Release/net48/AutoReport.Tests.exe config/extraction.default.json
      - uses: actions/upload-artifact@v4
        with:
          name: AutoReport-net48
          path: |
            src/AutoReport.Cli/bin/Release/net48/
            src/AutoReport.WinForms/bin/Release/net48/
            config/
            README.md
            docs/
